<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trying Bento Grid</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>
<body>
    <div class="grid-container">
        <div class="item" style="grid-area: item-img1">
            <img src="./img/img-people.jpg" alt="People Photo">
        </div>
        <div class="item" style="grid-area: text-vrt"></div>
        <div class="item" style="grid-area: btn-vrt"></div>
        <div class="item" style="grid-area: text-area"></div>
        <div class="item" style="grid-area: item-img2"></div>
    </div>
</body>
</html>
