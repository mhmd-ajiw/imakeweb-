<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Fase 2</title>
</head>
<body>
    <input type="text" id="input-txt">
    <button type="button" id="tambah-btn">Tambah</button>
    <hr style="margin: 20px 0">
    <ul id="daftar-tugas">

    </ul>

    <script>
        const txt = document.getElementById('input-txt');
        const tambah = document.getElementById('tambah-btn');
        const daftar = document.getElementById('daftar-tugas');

        tambah.addEventListener('click', function() {
            const valtxt = txt.value;

            if(valtxt.trim() === ""){
                alert('Tidak ada input, tolong masukan teks dahulu!');
                return;
            }   

            const listBaru = document.createElement('li');
            listBaru.textContent = valtxt;
            const listBtn = document.createElement('button');
            listBtn.textContent = 'Hapus';
            listBaru.appendChild(listBtn);
            daftar.appendChild(listBaru);

            // Koreksi reset value teks
            txt.value = "";
        });

        daftar.addEventListener('click', function(event) {
            if(event.target.tagName === 'BUTTON') {
                event.target.parentElement.remove();
            }
        });
    </script>
</body>
</html>
