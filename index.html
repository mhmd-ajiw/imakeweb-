<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation 1</title>
</head>
<body>
    <div id="kontrol-utama">
        <button id="btn-tambah-log">Catat Kedatangan Baru</button>
    </div>
    
    <!-- Terminal Induk / Kontainer Event Delegation -->
    <div id="panel-log" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 50px;">
        <!-- Tombol-tombol log akan disuntikkan ke sini secara dinamis -->
    </div>

    <script>
       const newBtn = document.getElementById('btn-tambah-log');
       const containerLog = document.getElementById('panel-log');

       newBtn.addEventListener('click', function() {
            if(event.target.id === 'btn-tambah-log'){
                const addBtn  = document.createElement('button');

                addBtn.textContent = 'Bus Tiba (Klik untuk Selesaikan)';
                addBtn.classList.add('item-log');
                addBtn.style.margin = '3px';
                addBtn.style.padding = '5px';
                containerLog.appendChild(addBtn);
            }
       });

       containerLog.addEventListener('click', function(event) {
            if(event.target.classList.contains('item-log')) {
                event.target.textContent = 'Selesai';
                event.target.style.backgroundColor = 'Gray';
                event.target.style.color = 'White';
            }
       });
    </script>
</body>
</html>
