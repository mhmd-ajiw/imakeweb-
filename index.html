<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-flex">
        <div class="display">
            <p id="valDisplay"></p>
        </div>
        <div class="btn-flex">
            <button type="button" id="tambah">Tambah</button>
            <button type="button" id="kurang">Kurang</button>
            <button type="button" id="reset">Reset</button>
        </div>
    </div>


    <script>
        const Plus = document.getElementById('tambah');
        const Minus = document.getElementById('kurang');
        const Reset = document.getElementById('reset');

        Plus.addEventListener('click', function() {
            const valNum = Number(document.getElementById('valDisplay').value) || 0;
            const result = valNum + 1;
            
            document.getElementById('valDisplay').value = result;
            document.getElementById('valDisplay').textContent = result;
        });

        Minus.addEventListener('click', function() {
            const valNum = Number(document.getElementById('valDisplay').value) || 0;
            if (valNum === 0){
                alert('Value is zero, cannot minus.')
            } else {
                const result = valNum - 1;
                document.getElementById('valDisplay').value = result;
                document.getElementById('valDisplay').textContent = result;
            }
        });

        Reset.addEventListener('click', function() {
            document.getElementById('valDisplay').value = 0;
            document.getElementById('valDisplay').textContent = 0;
        });

        
    </script>

</body>
</html>
